<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" href="client-web-listagem.css">
</head>
<body>
    
    <h2>Lista de Produtos</h2>

    <div id="formulario" class="formulario">
        <div class="grupo-campos">
            <label for="id">ID:</label>
            <input type="text" id="id" name="id" placeholder="Ex.: 1" inputmode="numeric" autocomplete="off">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Controle" autocomplete="off">

            <label for="preco">Preço:</label>
            <input type="text" id="preco" name="preco" placeholder="0,00" inputmode="decimal" autocomplete="off">

            <label for="quantidade">Quantidade:</label>
            <input type="text" id="quantidade" name="quantidade" placeholder="0" inputmode="numeric" autocomplete="off">

            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="disponivel">Disponível</option>
                <option value="indisponivel">Indisponível</option>
            </select>
        </div>

        <div class="acoes">
            <button id="salvar" onclick="salvarProduto()">Salvar</button>
            <button id="atualizar" onclick="atualizarProduto()">Atualizar</button>
            <button id="deletar" onclick="deletarProduto()">Deletar</button>
            <button id="consultar" onclick="consultarProduto()">Consultar</button>
            <button id="limpar" onclick="limparCampos()">Limpar Campos</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="productTableBody"></tbody>    
    </table>

    <div id="erroMensage" style="color: red;" display="none"></div>

    <p>Total de produtos: <span id="totalProdutos">0</span></p>

    <script src="client-web-listagem.js"></script>

</body>
</html>
